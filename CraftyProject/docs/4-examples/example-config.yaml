# Example CRAFTY configuration (regionalised dataset)
#
# This config is intended to work with the default dataset layout documented in:
#   docs/appendices/default-scenario-layout.md
#
# Path handling and priority (typical):
#   1) CLI overrides (e.g., --project-path, --output-path) if supported by your launcher
#   2) Explicit paths in this YAML (e.g., BASELINE_path, CAPITALS_directory)
#   3) Auto-discovery from project_path using the default folder conventions

# -------------------------------------------------------------------
# 1) Project + scenario
# -------------------------------------------------------------------

# Root folder of your dataset (contains: AFTs/, services/, worlds/, csv/, ...)
# Tip (Windows): use forward slashes to avoid escaping backslashes.
project_path: "C:/Users/<user>/CRAFTY_DATA/CRAFTY-EU-1km"

# Scenario name (must match your data folders / filenames, e.g., services/demand/<scenario>/)
scenario: "ssp126"

# Enable regionalised runs (requires: per-region demand files and region mapping tables)
regionalization: true


# -------------------------------------------------------------------
# 2) Optional explicit input overrides (leave commented if using default layout)
# -------------------------------------------------------------------
# If you uncomment these, they take priority over auto-discovery.

# metaData_directory: "C:/.../CRAFTY-EU-1km_upscaled/csv"
# BASELINE_path: "C:/.../CRAFTY-EU-1km_upscaled/worlds/Baseline_map.csv"
# CAPITALS_directory: "C:/.../CRAFTY-EU-1km_upscaled/worlds/capitals/ssp126"
# aft_behevoir_directory: "C:/.../CRAFTY-EU-1km_upscaled/AFTs/agents/default_agents"
# service_demands_path: "C:/.../CRAFTY-EU-1km_upscaled/services/demand/ssp126"
# service_utility_weight_path: "C:/.../CRAFTY-EU-1km_upscaled/services/Service_Utility_Weights/ssp126_Utility_Weight_EU.csv"
# services_taxes_subsidies_path: "C:/.../CRAFTY-EU-1km_upscaled/services/services_taxes_subsidies"
# land_taxes_subsidies_path: "C:/.../CRAFTY-EU-1km_upscaled/AFTs/land_taxes_subsidies/ssp126_land_taxes_subsidies_EU.csv"
# landControle_directories:
#   - "C:/.../CRAFTY-EU-1km_upscaled/worlds/LandUseControl/Urban/ssp126"
#   - "C:/.../CRAFTY-EU-1km_upscaled/worlds/LandUseControl/Water/ssp126"
# capital_degradation_directory: "C:/.../CRAFTY-EU-1km_upscaled/worlds/shocksMap"

# -------------------------------------------------------------------
# 3) Core mechanisms (model behaviour switches)
# -------------------------------------------------------------------

# Ensure balanced eco-service supply and demand during initial tick
initial_demand_supply_equilibrium: true

# Abandon cell if the current owner competitiveness falls below threshold
use_abandonment_threshold: true

# If true, create a mutated child agent when a competitor wins competition
mutate_on_competition_win: false
mutation_interval: 0.01

# Probability of selecting the highest-utility AFT for a cell during competition
MostCompetitorAFTProbability: 0.8

# Behaviour model (optional feature)
use_AFTs_categories_GiveIn: false

# Neighbour effects (competition candidate filtering)
use_neighbor_priority: true
neighbor_priority_probability: 0.95
neighbor_radius: 2

# -------------------------------------------------------------------
# 4) Competitiveness and land-change “rates”
# -------------------------------------------------------------------

# Seed selection strategy for the set of cells that participate in processes:
# - number: random seed id
# - path: read seeds from file
# - "rank": deterministic rank-by-utility selection (recommended for reproducibility)
seedID: "rank"

# Percentage of land that can be abandoned per tick/year
land_abandonment_percentage: 0.03

# Percentage of cells participating in the competitiveness process per tick/year
participating_cells_percentage: 0.05

# Fraction of unmanaged cells that can be taken over per tick/year (project-specific)
takeOverUnmanageCells_percentage: 0.8

# Number of times marginal utility is recalculated per tick/year
marginal_utility_calculations_per_tick: 5

# -------------------------------------------------------------------
# 5) Outputs
# -------------------------------------------------------------------

# Enable CSV outputs
generate_output_files: true

# If empty → CRAFTY uses a timestamped run folder under:
#   <project_path>/output/<scenario>/
output_folder_name: ""

# Charts/plots (availability depends on build)
generate_charts_plots_PNG: true
generate_charts_plots_PDF: false

# Map exports can be very heavy on large grids: keep off for parameter sweeps.
generate_map_output_files: false
generate_map_plots_tif: false
map_output_years: [2020, 2025, 2030, 2050, 2100]

# Tracking adds extra outputs useful for debugging and calibration
track_changes: false

# -------------------------------------------------------------------
# 6) Logging and performance measures
# -------------------------------------------------------------------

# If true, export a dedicated log file into the run output folder (when supported)
export_LOGGER: false
LOGGER_info: true
LOGGER_warn: true
LOGGER_trace: false

# Runtime timing summaries
printAbstractModelRunnerMeasures: true
printRegionalModelRunnerMeasures: true
